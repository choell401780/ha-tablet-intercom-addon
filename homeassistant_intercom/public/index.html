<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>HomeAssistant InterCom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══════════ SETUP SCREEN ═══════════ -->
  <div id="screen-setup" class="screen active">
    <div class="setup-card">
      <div class="logo">📞</div>
      <h1>HomeAssistant InterCom</h1>
      <p>Welche Station ist dieses Tablet?</p>
      <div class="setup-list">
        <button class="btn-pick" data-id="buero">
          <span class="pick-icon">🏢</span> Büro
        </button>
        <button class="btn-pick" data-id="flur">
          <span class="pick-icon">🚪</span> Flur
        </button>
        <button class="btn-pick" data-id="werkstatt">
          <span class="pick-icon">🔧</span> Werkstatt
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════ MAIN SCREEN ═══════════ -->
  <div id="screen-main" class="screen">

    <!-- Header -->
    <header id="header">
      <div class="hdr-left">
        <span id="lbl-station"></span>
        <span id="lbl-status" class="hdr-sub">…</span>
      </div>
      <div class="hdr-right">
        <div id="dot-ws" class="dot dot-off" title="WebSocket"></div>
      </div>
    </header>

    <!-- Video -->
    <div id="video-area">
      <video id="vid-remote" autoplay playsinline></video>

      <div id="vid-placeholder">
        <div class="ph-icon">📺</div>
        <div class="ph-text">Kein eingehendes Bild</div>
      </div>

      <video id="vid-local" autoplay playsinline muted></video>

      <!-- Calling/Ringing overlay -->
      <div id="overlay-call" class="call-overlay hidden">
        <span id="overlay-text"></span>
      </div>
    </div>

    <!-- Incoming call -->
    <div id="banner-incoming" class="banner banner-incoming hidden">
      <div class="banner-info">
        <div class="ring-dot"></div>
        <span>Anruf von <strong id="lbl-caller"></strong></span>
      </div>
      <div class="banner-btns">
        <button id="btn-accept" class="btn-green">Annehmen</button>
        <button id="btn-reject" class="btn-red">Ablehnen</button>
      </div>
    </div>

    <!-- Busy notice -->
    <div id="banner-busy" class="banner banner-busy hidden">
      <span id="lbl-busy"></span>
    </div>

    <!-- Station buttons -->
    <div id="panel-stations">
      <div class="panel-label">Anrufen:</div>
      <div id="station-list"></div>
    </div>

    <!-- Active call controls -->
    <div id="panel-controls" class="hidden">
      <button id="btn-mute" class="ctrl-btn">
        <span class="ci">🎤</span><span class="cl">Stumm</span>
      </button>
      <button id="btn-cam" class="ctrl-btn">
        <span class="ci">📷</span><span class="cl">Kamera aus</span>
      </button>
      <button id="btn-hangup" class="ctrl-btn ctrl-red">
        <span class="ci">📵</span><span class="cl">Auflegen</span>
      </button>
    </div>

    <!-- Settings panel -->
    <div id="panel-settings" class="hidden">

      <div class="s-group">
        <div class="s-label">🔔 Klingelton</div>
        <div class="ring-list">
          <label class="ring-item"><input type="radio" name="ringtone" value="ring1"><span>Ton 1</span></label>
          <label class="ring-item"><input type="radio" name="ringtone" value="ring2"><span>Ton 2</span></label>
          <label class="ring-item"><input type="radio" name="ringtone" value="ring3"><span>Ton 3</span></label>
          <label class="ring-item"><input type="radio" name="ringtone" value="ring4"><span>Ton 4</span></label>
          <label class="ring-item"><input type="radio" name="ringtone" value="ring5"><span>Ton 5</span></label>
        </div>
        <button id="btn-ring-test" class="s-btn">▶ Testen</button>
      </div>

      <div class="s-group">
        <div class="s-label">🔊 Lautsprecher <span id="vol-pct" class="s-val">70%</span></div>
        <input type="range" id="vol-slider" class="s-range" min="0" max="100" value="70">
      </div>

      <div class="s-group">
        <div class="s-label">🎙 Mikrofon-Gain <span id="gain-pct" class="s-val">100%</span></div>
        <input type="range" id="gain-slider" class="s-range" min="0" max="300" value="100">
      </div>

    </div>

    <!-- Status bar -->
    <div id="statusbar">Initialisiere…</div>

    <!-- Debug -->
    <div id="debug-panel" class="hidden">
      <div class="dbg-hdr">
        <span>Debug</span>
        <button id="btn-dbg-clear">Leeren</button>
      </div>
      <div id="dbg-log"></div>
    </div>

    <!-- Footer -->
    <div id="footer">
      <button id="btn-change"          class="foot-btn">Station ändern</button>
      <button id="btn-settings-toggle" class="foot-btn">⚙ Einstellungen</button>
      <button id="btn-dbg-toggle"      class="foot-btn">Debug</button>
    </div>

  </div><!-- /screen-main -->

  <script src="app.js"></script>
</body>
</html>
