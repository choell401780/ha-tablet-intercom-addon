<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>HomeAssistant InterCom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="screen-main" class="screen active">

    <!-- Header -->
    <header>
      <div class="hdr-left">
        <span id="lbl-station">HomeAssistant InterCom</span>
        <span id="lbl-status" class="hdr-sub">Lade Konfiguration…</span>
      </div>
      <div class="hdr-right">
        <div id="dot-ws" class="dot dot-off" title="WebSocket"></div>
      </div>
    </header>

    <!-- Video -->
    <div id="video-area">
      <video id="vid-remote" autoplay playsinline></video>
      <div id="vid-placeholder">
        <div class="ph-icon">📺</div>
        <div class="ph-text">Kein eingehendes Bild</div>
      </div>
      <video id="vid-local" autoplay playsinline muted></video>
      <div id="overlay-call" class="call-overlay hidden">
        <span id="overlay-text"></span>
      </div>
    </div>

    <!-- Incoming call banner -->
    <div id="banner-incoming" class="banner banner-incoming hidden">
      <div class="banner-info">
        <div class="ring-dot"></div>
        <span>Anruf von <strong id="lbl-caller"></strong></span>
      </div>
      <div class="banner-btns">
        <button id="btn-accept" class="btn-green">Annehmen</button>
        <button id="btn-reject" class="btn-red">Ablehnen</button>
      </div>
    </div>

    <!-- Busy notice -->
    <div id="banner-busy" class="banner banner-busy hidden">
      <span id="lbl-busy"></span>
    </div>

    <!-- Station call buttons (populated from /api/config) -->
    <div id="panel-stations">
      <div class="panel-label">Anrufen:</div>
      <div id="station-list"><span class="no-stations">Lade…</span></div>
    </div>

    <!-- Active call controls -->
    <div id="panel-controls" class="hidden">
      <button id="btn-mute" class="ctrl-btn">
        <span class="ci">🎤</span><span class="cl">Stumm</span>
      </button>
      <button id="btn-cam" class="ctrl-btn">
        <span class="ci">📷</span><span class="cl">Kamera aus</span>
      </button>
      <div class="vol-row">
        <span class="vol-icon">🔊</span>
        <input type="range" id="vol-slider" class="vol-slider" min="0" max="100" value="80">
      </div>
      <button id="btn-hangup" class="ctrl-btn ctrl-red">
        <span class="ci">📵</span><span class="cl">Auflegen</span>
      </button>
    </div>

    <!-- Status bar -->
    <div id="statusbar">Initialisiere…</div>

    <!-- Debug panel – only visible when debug: true in add-on config -->
    <div id="debug-panel" class="hidden">
      <div class="dbg-hdr">
        <span>Debug – HomeAssistant InterCom</span>
        <button id="btn-dbg-clear">Leeren</button>
      </div>
      <div id="dbg-log"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
