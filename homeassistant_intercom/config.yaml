name: "HomeAssistant InterCom"
version: "1.2.0"
slug: "homeassistant_intercom"
description: "Lokales Audio/Video-Intercom für Android-Tablets – kein Cloud-Dienst erforderlich"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:video"
panel_title: "HomeAssistant InterCom"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "HomeAssistant InterCom WebUI & WebSocket"
webui: "http://[HOST]:[PORT:8099]"
options:
  station_id: "buero"
  station_name: "Büro"
  available_targets:
    - id: "flur"
      name: "Flur"
    - id: "werkstatt"
      name: "Werkstatt"
  ringtone: "ring1"
  speaker_volume: 80
  microphone_gain: 100
  debug: false

schema:
  station_id: str
  station_name: str
  available_targets:
    - id: str
      name: str
  ringtone: str
  speaker_volume: int(0,100)
  microphone_gain: int(0,300)
  debug: bool
